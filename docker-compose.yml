  version: '3.8'

  services:
    app:
      build:
        context: .
      container_name: yii2-app
      ports:
        - "8080:80"
      volumes:
        - .:/var/www/html
      depends_on:
        - db

    db:
      image: mysql:5.7
      container_name: yii2-db
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: yii2advanced
        MYSQL_USER: yii2advanced
        MYSQL_PASSWORD: secret
      ports:
        - "3306:3306"
      volumes:
        - db_data:/var/lib/mysql

  volumes:
    db_data:
